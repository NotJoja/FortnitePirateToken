[config]
schemaVersion = "0.0.1"

[package]
namespace = "Joja"
name = "FortnitePirateToken"
versionNumber = "1.0.3"
description = "A super rare, indestructible $0 valuable. Extract the Pirate Shop Token and the next shop is completely free."
websiteUrl = "https://github.com/NotJoja/FortnitePirateToken"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2304"
Zehs-REPOLib = "4.5.1"

[build]
icon = "./thunderstore/icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/netstandard2.1/FortnitePirateToken.dll"
target = "./"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]

[publish.categories]
repo = ["mods", "valuables"]
